syntax = "proto3";

package avtoms.invoice.v1;

option go_package = "github.com/avtoms/proto/gen/go/avtoms/invoice/v1;invoicev1";

// InvoiceService owns invoices and fiscal receipts via the OFD (M6).
service InvoiceService {
  rpc GenerateInvoice(GenerateInvoiceRequest) returns (Invoice);
  rpc GetInvoice(GetInvoiceRequest) returns (Invoice);
  // GetInvoiceByToken resolves an invoice from its public_token — the identity a
  // customer's receipt link carries. Serves the unauthenticated check page, so it
  // must be reachable with nothing but the token.
  rpc GetInvoiceByToken(GetInvoiceByTokenRequest) returns (Invoice);
  rpc MarkPaid(MarkPaidRequest) returns (Invoice);
  rpc VoidReceipt(VoidReceiptRequest) returns (Invoice);
  rpc ResendReceipt(ResendReceiptRequest) returns (Invoice);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);

  // Shop payment cards — the shop's own receiving cards (HUMO/UZCARD/…) that a
  // customer transfers to when paying by card. Managed once, reused per payment.
  rpc ListShopCards(ListShopCardsRequest) returns (ListShopCardsResponse);
  rpc CreateShopCard(CreateShopCardRequest) returns (ShopCard);
  rpc UpdateShopCard(UpdateShopCardRequest) returns (ShopCard);
  rpc DeleteShopCard(DeleteShopCardRequest) returns (DeleteShopCardResponse);
}

message ListInvoicesRequest {
  string shop_id = 1;
}
message ListInvoicesResponse {
  repeated Invoice invoices = 1;
}

enum FiscalStatus {
  FISCAL_STATUS_UNSPECIFIED = 0;
  FISCAL_STATUS_PENDING = 1;
  FISCAL_STATUS_FISCALIZED = 2;
  FISCAL_STATUS_FAILED = 3;
  FISCAL_STATUS_VOIDED = 4;
}

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CASH = 1;
  PAYMENT_METHOD_OTHER = 2;
  PAYMENT_METHOD_CARD = 3;
}

message Invoice {
  string id = 1;
  string shop_id = 2;
  string work_order_id = 3;
  int64 total = 4;
  FiscalStatus fiscal_status = 5;
  string fiscal_qr = 6;
  string fiscal_receipt_id = 7;
  bool paid = 8;
  PaymentMethod payment_method = 9;
  string created_at = 10;
  // Set for a CARD payment: the saved shop card the money was received on (empty
  // when the number was typed ad-hoc). Snapshot of the number kept in card_number.
  string card_id = 11;
  // The card number the payment was received on (masked/plain as entered). Filled
  // for CARD payments whether the card was picked from the saved list or typed once.
  string card_number = 12;
  // Unguessable public handle for this receipt (128 bits of randomness, base62).
  // It is what the QR on the check encodes and what the customer's link carries, so
  // the invoice id itself never has to become public. Minted at generation time.
  string public_token = 13;
}

// ShopCard is one of a shop's own receiving cards. A customer paying by card
// transfers to this number; the cashier picks which card the money landed on.
message ShopCard {
  string id = 1;
  string shop_id = 2;
  string label = 3;        // friendly name, e.g. "Kapital HUMO"
  string card_number = 4;  // the receiving card number
  string holder = 5;       // cardholder name (optional)
  bool active = 6;
  string created_at = 7;
}

message GenerateInvoiceRequest {
  string shop_id = 1;
  string work_order_id = 2;
  int64 total = 3;
}
message GetInvoiceRequest {
  string id = 1;
}
message GetInvoiceByTokenRequest {
  string token = 1;
}
message MarkPaidRequest {
  string id = 1;
  PaymentMethod payment_method = 2;
  // For a CARD payment: the saved shop card the money was received on (optional).
  string card_id = 3;
  // For a CARD payment: the card number the money was received on. Sent when the
  // number was typed ad-hoc, or as a snapshot of the chosen saved card.
  string card_number = 4;
}
message VoidReceiptRequest {
  string id = 1;
}
message ResendReceiptRequest {
  string id = 1;
}

message ListShopCardsRequest {
  string shop_id = 1;
}
message ListShopCardsResponse {
  repeated ShopCard cards = 1;
}
message CreateShopCardRequest {
  string shop_id = 1;
  string label = 2;
  string card_number = 3;
  string holder = 4;
}
message UpdateShopCardRequest {
  string id = 1;
  string label = 2;
  string card_number = 3;
  string holder = 4;
  bool active = 5;
}
message DeleteShopCardRequest {
  string id = 1;
}
message DeleteShopCardResponse {
  string id = 1;
}
