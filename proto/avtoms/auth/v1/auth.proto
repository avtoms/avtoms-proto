syntax = "proto3";

package avtoms.auth.v1;

option go_package = "github.com/avtoms/proto/gen/go/avtoms/auth/v1;authv1";

// AuthService owns staff identity: OTP sign-in, tokens, and staff lifecycle (M1 + staff mgmt).
service AuthService {
  // RequestOtp triggers an OTP to be sent to the phone. Returns immediately;
  // delivery happens asynchronously via the notification service.
  rpc RequestOtp(RequestOtpRequest) returns (RequestOtpResponse);
  rpc VerifyOtp(VerifyOtpRequest) returns (TokenPair);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenPair);

  // SignIn exchanges a login and password for the same token pair OTP returns. The way in
  // for staff who were given an account rather than discovered by their phone number: the
  // shop is decided when the account is created, so signing in only proves who is asking.
  rpc SignIn(SignInRequest) returns (TokenPair);
  // SetStaffPassword sets or replaces a staff member's login and password. Admin-scoped at
  // the gateway; it is also how a forgotten password is reset, since nothing can read one back.
  rpc SetStaffPassword(SetStaffPasswordRequest) returns (Staff);

  // VerifyClientOtp verifies an OTP for a CUSTOMER (not staff) and returns a long-lived
  // ROLE_CLIENT token (subject = phone, no shop). Unlike VerifyOtp it never creates a staff
  // record. Used by the customer mobile app; OTP is requested via the normal RequestOtp.
  rpc VerifyClientOtp(VerifyClientOtpRequest) returns (TokenPair);

  // Authenticate validates an access token; used by the gateway middleware.
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);

  rpc InviteMechanic(InviteMechanicRequest) returns (Staff);
  rpc DeactivateStaff(DeactivateStaffRequest) returns (Staff);
  rpc UpdateStaff(UpdateStaffRequest) returns (Staff);
  rpc ListStaff(ListStaffRequest) returns (ListStaffResponse);

  // GetMe returns the caller's own live staff record (used by the mechanic app to pick up
  // owner-granted permissions without re-logging in). staff_id is injected by the gateway.
  rpc GetMe(GetMeRequest) returns (Staff);
  // SetStaffPermissions lets an owner grant/revoke a worker's extra capabilities
  // (e.g. creating work orders). Owner-scoped at the gateway.
  rpc SetStaffPermissions(SetStaffPermissionsRequest) returns (Staff);

  // ── Shop-defined roles and worker accounts ──
  //
  // A shop's staff are not two kinds of person. Between the owner, who can do everything, and
  // the mechanic, who could reach almost everything because nothing stopped them, sit the jobs
  // a service actually has: a cashier who takes money but must not see the month's profit, a
  // storekeeper who receives parts but does not price them, a foreman who assigns work.
  //
  // A role is a named bundle of permission keys, owned by one shop and composed by its owner —
  // there is no fixed list of roles, because no two services divide the work the same way.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc CreateRole(CreateRoleRequest) returns (ShopRole);
  rpc UpdateRole(UpdateRoleRequest) returns (ShopRole);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);

  // CreateStaff adds a worker with a login and password, rather than waiting for them to be
  // discovered by their phone number. A shop hires someone on Monday and wants them working on
  // Monday; InviteMechanic's SMS round-trip cannot promise that, and it cannot give the person
  // a role at the moment they are created either.
  rpc CreateStaff(CreateStaffRequest) returns (Staff);
  // SetStaffAccess assigns a role and any grants held on top of it. Owner-scoped at the gateway.
  rpc SetStaffAccess(SetStaffAccessRequest) returns (Staff);

  // Super-admin user management (admin-only, across all shops).
  rpc ListAllStaff(ListAllStaffRequest) returns (ListStaffResponse);
  rpc SetStaffActive(SetStaffActiveRequest) returns (Staff);
  rpc SetStaffRole(SetStaffRoleRequest) returns (Staff);

  // Super-admin shop registry (admin-only). A shop and its owner are created together by
  // RegisterShop, because neither is usable alone: a shop nobody can sign in to is dead
  // weight, and an owner with no shop has nowhere to work.
  rpc RegisterShop(RegisterShopRequest) returns (RegisterShopResponse);
  rpc ListShops(ListShopsRequest) returns (ListShopsResponse);
  rpc UpdateShop(UpdateShopRequest) returns (Shop);
}

// Shop is a registered service — the tenant every staff record, order and invoice hangs off.
// Until this existed a shop_id was a bare UUID nobody could put a name to, so the admin
// console listed shops by the first eight characters of their id.
message Shop {
  string id = 1;
  string name = 2;
  // What the place actually does — full service, oil change, body work, tyres. Free text
  // rather than an enum: the trade names its own specialities and they differ by region.
  string service_type = 3;
  // How many people work there, as stated at registration. A rough sizing figure for the
  // operator, deliberately not derived from the staff records — most shops are registered
  // before their workers have accounts.
  int32 staff_count = 4;
  // The address as a person reads it — this is what goes on the customer's check.
  string location = 5;
  // Where the service actually is. 0/0 means nobody has placed it on the map: the Gulf of
  // Guinea is not in Uzbekistan, so it is a safe "unset" for these two and saves an extra
  // has_location flag.
  double latitude = 10;
  double longitude = 11;
  // The service's own public number, which is not the owner's: it goes on the customer's
  // check, and the owner's personal phone should not.
  string phone = 6;
  bool active = 7;
  string created_at = 8;
  // Staff records currently attached to this shop. Read-only; see staff_count for the
  // figure the shop gave for itself.
  int32 members = 9;
}

message RegisterShopRequest {
  // ── the company ──
  string name = 1;
  string service_type = 2;
  int32 staff_count = 3;
  string location = 4;
  string phone = 5;
  double latitude = 10;
  double longitude = 11;
  // ── its owner, created in the same transaction ──
  string owner_name = 6;
  string owner_phone = 7;
  string owner_login = 8;
  string owner_password = 9;
}

message RegisterShopResponse {
  Shop shop = 1;
  Staff owner = 2;
}

message ListShopsRequest {}
message ListShopsResponse {
  repeated Shop shops = 1;
}

message UpdateShopRequest {
  string id = 1;
  string name = 2;
  string service_type = 3;
  int32 staff_count = 4;
  string location = 5;
  string phone = 6;
  bool active = 7;
  double latitude = 8;
  double longitude = 9;
}

message SignInRequest {
  string login = 1;
  string password = 2;
}

message SetStaffPasswordRequest {
  string staff_id = 1;
  // Empty keeps the login the staff member already has, so a password can be reset without
  // renaming the account.
  string login = 2;
  string password = 3;
}

message ListAllStaffRequest {}
message SetStaffActiveRequest {
  string staff_id = 1;
  bool active = 2;
}
message SetStaffRoleRequest {
  string staff_id = 1;
  Role role = 2;
}

// ── Permissions ──
//
// A permission is a plain string key. The authoritative catalogue is this list; the auth
// service rejects any key not on it, so a typo cannot be granted and then silently never
// checked. Keys are `area.verb` and deliberately coarse — one per thing a person is or is not
// trusted with, not one per endpoint, because an owner ticking boxes is describing a job.
//
//   orders.view        see the work-order board and any order on it
//   orders.create      open a new work order
//   orders.edit        change an order: line items, notes, odometer, status, timers
//   orders.assign      put an order, or a line on it, on a particular mechanic
//   sales.manage       sell over the counter and void a sale
//   warehouse.view     see products, stock levels and movements
//   warehouse.manage   create and price products, adjust stock
//   customers.manage   create and edit customers and their vehicles
//   catalog.manage     the service menu and its prices
//   finance.view       money as a total: dashboard figures, statistics, reports, profit & loss
//   finance.manage     money as a transaction: expenses, invoices, payments, debts, ledgers
//   staff.manage       add workers, set their passwords, build roles and assign them
//   settings.manage    the shop's own settings
//   ai.use             the assistant, which can read across everything above
//
// Owners and super-admins are not granted these; they hold all of them by virtue of being the
// owner. A permission system that can lock an owner out of their own shop is a support ticket
// waiting to happen, and there would be nobody left who could fix it.
//
// The labels a person reads are not here. They belong to the clients, which already translate
// into three languages; a key travelling with its own English name would be a fourth wording
// nobody maintains.

// ShopRole is a named bundle of permissions belonging to one shop.
message ShopRole {
  string id = 1;
  string shop_id = 2;
  string name = 3;
  repeated string permissions = 4;
  // How many staff currently hold this role. Read-only, and the reason deleting one is worth
  // thinking about: the people holding it do not stop existing, they stop being able to work.
  int32 members = 5;
  string created_at = 6;
  string updated_at = 7;
}

message ListRolesRequest {
  string shop_id = 1;
}
message ListRolesResponse {
  repeated ShopRole roles = 1;
}
message CreateRoleRequest {
  string shop_id = 1;
  string name = 2;
  repeated string permissions = 3;
}
message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  // Replaces the role's permissions wholesale. A role is edited by ticking boxes and saving
  // the result, so the message that arrives is the whole answer, not a change to apply.
  repeated string permissions = 3;
}
message DeleteRoleRequest {
  string id = 1;
}
message DeleteRoleResponse {
  bool ok = 1;
}

message CreateStaffRequest {
  string shop_id = 1;
  string name = 2;
  string phone = 3;
  string login = 4;
  string password = 5;
  // The role this person starts with. Optional: a worker with no role and no grants can sign
  // in and see nothing, which is a safe place to start and an obvious one to fix.
  string role_id = 6;
  // Grants held on top of the role — the one-off "and they also do the ordering" that does not
  // deserve a role of its own.
  repeated string permissions = 7;
}

message SetStaffAccessRequest {
  string staff_id = 1;
  // Empty removes the role, leaving only the direct grants below.
  string role_id = 2;
  repeated string permissions = 3;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_MECHANIC = 2;
  ROLE_ADMIN = 3;
  ROLE_CLIENT = 4; // a customer signed in to the client mobile app (no shop, no staff record)
}

message Staff {
  string id = 1;
  string shop_id = 2;
  string phone = 3;
  string name = 4;
  Role role = 5;
  bool active = 6;
  string created_at = 7;
  string avatar_url = 8; // profile photo URL (object storage), may be empty
  // Whether this person may create work orders. Superseded by the permission catalogue and
  // now derived from it — true exactly when effective_permissions contains "orders.create".
  // Kept because the mechanic app reads it, and a field that still answers the same question
  // correctly is not worth a coordinated client release to remove.
  bool can_create_orders = 9;
  // The name this person signs in with. Empty for an account that predates passwords and
  // still arrives by phone. The password itself is never carried on this message.
  string login = 10;
  // The shop's registered name, filled by services that have the registry to hand. Saves
  // every caller joining staff to shops just to show who somebody works for.
  string shop_name = 11;
  // The role this person holds, if any, and its name so a caller listing staff need not also
  // fetch the roles to render the column.
  string role_id = 12;
  string role_name = 13;
  // Grants held directly, on top of whatever the role carries. Separate from the effective
  // set below because an editor has to show what was ticked for this person specifically —
  // merging the two would make revoking a role's permission look possible on the staff form
  // when it is not.
  repeated string permissions = 14;
  // Everything this person can actually do: the role's permissions, their own grants, and for
  // an owner or super-admin the whole catalogue. This is the field to check; the two above
  // describe how it was arrived at.
  repeated string effective_permissions = 15;
}

message UpdateStaffRequest {
  string staff_id = 1;
  string name = 2;
  string phone = 3;
  string avatar_url = 4;
}

message GetMeRequest {
  string staff_id = 1; // injected by the gateway from the authenticated context
}

message SetStaffPermissionsRequest {
  string staff_id = 1;
  bool can_create_orders = 2;
}

message RequestOtpRequest {
  string phone = 1;
}
message RequestOtpResponse {
  string challenge_id = 1;
  int32 resend_after_seconds = 2;
}

message VerifyOtpRequest {
  string challenge_id = 1;
  string code = 2;
}

message VerifyClientOtpRequest {
  string challenge_id = 1;
  string code = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  Staff staff = 4;
}

message AuthenticateRequest {
  string access_token = 1;
}
message AuthenticateResponse {
  string staff_id = 1;
  string shop_id = 2;
  Role role = 3;
  // Live capability flag so the gateway can authorize actions (e.g. creating work orders)
  // immediately after an owner grants them, without waiting for the token to be re-issued.
  bool can_create_orders = 4;
  // Everything the caller may do, resolved from their role and grants on this request. Read
  // live rather than carried in the token on purpose: an owner who has just taken away access
  // to the till expects that to be true now, not in fifteen minutes when the token expires.
  repeated string permissions = 5;
}

message InviteMechanicRequest {
  string shop_id = 1;
  string phone = 2;
  string name = 3;
}

message DeactivateStaffRequest {
  string staff_id = 1;
}

message ListStaffRequest {
  string shop_id = 1;
}
message ListStaffResponse {
  repeated Staff staff = 1;
}
