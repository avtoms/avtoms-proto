  repeated Card cards = 1;
}

// AddCardRequest carries the PAN only long enough to read its brand and last four digits.
// Nothing keeps it: the service stores brand, last4, expiry and a token, and the number is
// gone the moment the response is built. When a real PSP arrives this request becomes its
// binding call and the stored shape does not change.
message AddCardRequest {
  string phone = 1;
  string pan = 2;
  string expiry = 3;              // "09/28"
  string holder = 4;
  bool is_default = 5;
}

message DeleteCardRequest {
  string phone = 1;
  string id = 2;
}

message SetDefaultCardRequest {
  string phone = 1;
  string id = 2;
}

message ValidatePromoCodeRequest {
  string code = 1;
  string phone = 2;
  string provider_id = 3;
  int64 amount = 4;               // the subtotal the discount applies to
  // The booking this code is being checked for, when there is one. A booking made with a
  // once-per-customer code has already spent it, and checking the code again while paying
  // for that same booking must not find it used up — so its own redemption is left out.
  string booking_id = 5;
}

message ValidatePromoCodeResponse {
  bool valid = 1;
  string reason = 2;              // why not, when invalid: "expired", "used", "other_shop"
  int64 discount = 3;             // in so'm, capped
  Promo promo = 4;
}

message CreatePaymentRequest {
  string phone = 1;
  string booking_id = 2;
  PaymentMethod method = 3;
  string card_id = 4;
  string promo_code = 5;
  int64 use_bonus = 6;
  // A client-generated key that makes a retried tap the same payment rather than a second
  // one. A phone loses its network exactly at the moment it matters.
  string idempotency_key = 7;
}

message GetPaymentRequest {
  string phone = 1;
  string id = 2;
}

message ListPaymentsRequest {
  string phone = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  int32 total = 2;
}

