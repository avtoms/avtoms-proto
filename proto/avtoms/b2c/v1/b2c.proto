// GetChatRequest opens a thread. With no id but a provider_id — or kind = SUPPORT — the
// thread is created on the spot, because tapping "write to the shop" cannot fail for want
// of a thread that nobody has made yet.
message GetChatRequest {
  string phone = 1;
  string id = 2;
  string provider_id = 3;
  ChatKind kind = 4;
  string booking_id = 5;
  int32 limit = 6;
  // Opens the thread with the master on this roadside call. The thread is made when a
  // master is assigned, so this finds it rather than creating one.
  string emergency_id = 7;
}

message GetChatResponse {
  Chat chat = 1;
  repeated ChatMessage messages = 2;
}

message SendChatMessageRequest {
  string phone = 1;
  string chat_id = 2;
  string provider_id = 3;         // starts a thread when chat_id is empty
  ChatKind kind = 4;
  string text = 5;
  string attachment_url = 6;
