syntax = "proto3";

package avtoms.notification.v1;

import "avtoms/common/v1/common.proto";

option go_package = "github.com/avtoms/proto/gen/go/avtoms/notification/v1;notificationv1";

// NotificationService delivers messages to customers/staff across Telegram + SMS with fallback (M7 + M8).
service NotificationService {
  rpc SendSms(SendSmsRequest) returns (SendResponse);
  rpc SendTelegram(SendTelegramRequest) returns (SendResponse);
  // SendReceipt delivers a finished receipt to a customer as a Telegram document.
  // Telegram fetches document_url itself, so the caller passes a link rather than bytes.
  rpc SendReceipt(SendReceiptRequest) returns (SendResponse);
  // Notify picks the best channel (Telegram, falling back to SMS).
  rpc Notify(NotifyRequest) returns (SendResponse);

  // Integration credentials, managed by the super admin (e.g. the PlayMobile SMS gateway).
  rpc ListIntegrations(ListIntegrationsRequest) returns (ListIntegrationsResponse);
  rpc GetIntegration(GetIntegrationRequest) returns (Integration);
  rpc UpdateIntegration(UpdateIntegrationRequest) returns (Integration);
  // GetIntegrationConfig returns a provider's UNMASKED values. For internal
  // service-to-service use only (e.g. the gateway reading R2 upload creds);
  // never expose its result to end clients.
  rpc GetIntegrationConfig(GetIntegrationRequest) returns (IntegrationConfig);
  // SendTestSms sends a one-off SMS synchronously and returns the gateway's actual
  // result/error, so the super admin can verify the credentials work.
  rpc SendTestSms(SendTestSmsRequest) returns (TestSmsResult);

  // Demo/sales lead capture from the public marketing landing page. CreateDemoRequest is
  // public (no auth); List/SetStatus are super-admin only.
  rpc CreateDemoRequest(CreateDemoRequestRequest) returns (DemoRequest);
  rpc ListDemoRequests(ListDemoRequestsRequest) returns (ListDemoRequestsResponse);
  rpc SetDemoRequestStatus(SetDemoRequestStatusRequest) returns (DemoRequest);

  // Sales CRM leads (potential customers the super-admin manages by hand): full contact +
  // deal details, edited through the pipeline. Super-admin only at the gateway.
  rpc CreateLead(CreateLeadRequest) returns (Lead);
  rpc ListLeads(ListLeadsRequest) returns (ListLeadsResponse);
  rpc UpdateLead(UpdateLeadRequest) returns (Lead);
  rpc DeleteLead(DeleteLeadRequest) returns (DeleteLeadResponse);
  // RecordShopLead puts a registered service on the sales board, called by the gateway the
  // moment a service is registered. The pipeline it belongs to ends in a signed customer, and
  // that end was the one stage nobody was writing down: a shop the operator sold, registered
  // and started billing never appeared on the board, so the win rate and the won value counted
  // only deals somebody retyped by hand.
  //
  // Deliberately an upsert, not a create: the same company usually arrives from the landing
  // page first, and a board that shows it twice — once as a lead being worked, once as a
  // customer — is worse than one that never showed it at all.
  rpc RecordShopLead(RecordShopLeadRequest) returns (Lead);

  // Persisted AI-assistant conversations (owner / super-admin chat history), scoped
  // to the staff member who owns them so threads follow the user across devices.
  rpc ListAiConversations(ListAiConversationsRequest) returns (ListAiConversationsResponse);
  rpc GetAiConversation(GetAiConversationRequest) returns (GetAiConversationResponse);
  rpc AppendAiMessages(AppendAiMessagesRequest) returns (AppendAiMessagesResponse);
  rpc DeleteAiConversation(DeleteAiConversationRequest) returns (DeleteAiConversationResponse);
}

// Lead is a potential customer tracked in the sales CRM: everything a lead can carry, from
// contact details and a photo to the deal price actually negotiated and its pipeline status.
message Lead {
  string id = 1;
  string name = 2;
  string phone = 3;
  string email = 4;
  string company = 5;    // garage / business name
  string image_url = 6;  // photo or logo (object storage URL)
  string city = 7;
  string address = 8;
  string source = 9;     // landing | referral | cold | telegram | instagram | walk_in | other
  string status = 10;    // new | contacted | qualified | negotiating | won | lost
  int64 deal_price = 11; // negotiated deal price in soum (0 until agreed)
  string notes = 12;
  string created_at = 13;
  string updated_at = 14;
  // The registered service this lead became, once it became one. Empty for a lead still being
  // worked. Set by RecordShopLead and never by the editor, so moving a card around the board
  // cannot detach a customer from the service it signed up as.
  string shop_id = 15;
}
message CreateLeadRequest {
  string name = 1;
  string phone = 2;
  string email = 3;
  string company = 4;
  string image_url = 5;
  string city = 6;
  string address = 7;
  string source = 8;
  string status = 9;
  int64 deal_price = 10;
  string notes = 11;
}
message ListLeadsRequest {}
message ListLeadsResponse {
  repeated Lead leads = 1;
}
message UpdateLeadRequest {
  string id = 1;
  string name = 2;
  string phone = 3;
  string email = 4;
  string company = 5;
  string image_url = 6;
  string city = 7;
  string address = 8;
  string source = 9;
  string status = 10;
  int64 deal_price = 11;
  string notes = 12;
}
message DeleteLeadRequest {
  string id = 1;
}
message DeleteLeadResponse {
  bool ok = 1;
}

// RecordShopLeadRequest describes a service that has just been registered, in the terms the
// sales board uses: the company is the service, the person is its owner.
message RecordShopLeadRequest {
  string shop_id = 1;
  string company = 2; // the service's name
  string name = 3;    // the owner — who the operator actually talks to
  string phone = 4;   // the owner's phone
  // The service's own public number. Not stored on the lead — the lead's phone is the person's
  // — but matched against, because whoever filled in the landing form months ago may well have
  // left the shop's number rather than their own.
  string shop_phone = 5;
  string city = 6;
  string address = 7;
  // Where on the board to put it. Blank means "won", which is what registering a service is.
  string status = 8;
}

// AiConversation is one saved assistant chat thread belonging to a staff member.
message AiConversation {
  string id = 1;
  string staff_id = 2;
  string shop_id = 3;
  string title = 4;       // short label derived from the first user message
  string created_at = 5;
  string updated_at = 6;
}
// AiChatMessage is one turn within a conversation.
message AiChatMessage {
  string id = 1;
  string conversation_id = 2;
  string role = 3;    // user | assistant
  string content = 4; // user text, or the assistant's HTML reply
  string created_at = 5;
}
message ListAiConversationsRequest {
  string staff_id = 1;
}
message ListAiConversationsResponse {
  repeated AiConversation conversations = 1;
}
message GetAiConversationRequest {
  string id = 1;
  string staff_id = 2; // ownership check: only the owner may read the thread
}
message GetAiConversationResponse {
  AiConversation conversation = 1;
  repeated AiChatMessage messages = 2;
}
message AppendAiMessagesRequest {
  string conversation_id = 1; // empty → create a new conversation
  string staff_id = 2;
  string shop_id = 3;
  string title = 4;                    // used when creating a new conversation
  repeated AiChatMessage messages = 5; // turns to append (e.g. the user turn + assistant reply)
}
message AppendAiMessagesResponse {
  AiConversation conversation = 1;
}
message DeleteAiConversationRequest {
  string id = 1;
  string staff_id = 2;
}
message DeleteAiConversationResponse {
  bool ok = 1;
}

// DemoRequest is a sales lead submitted from the public landing page.
message DemoRequest {
  string id = 1;
  string name = 2;
  string shop = 3;
  string phone = 4;
  string city = 5;
  string message = 6;
  string lang = 7;       // uz | ru | en
  string status = 8;     // new | contacted | closed
  string created_at = 9; // RFC3339
}
message CreateDemoRequestRequest {
  string name = 1;
  string shop = 2;
  string phone = 3;
  string city = 4;
  string message = 5;
  string lang = 6;
}
message ListDemoRequestsRequest {}
message ListDemoRequestsResponse {
  repeated DemoRequest requests = 1;
}
message SetDemoRequestStatusRequest {
  string id = 1;
  string status = 2;
}

message SendTestSmsRequest {
  string phone = 1;
}
message TestSmsResult {
  bool delivered = 1;
  string detail = 2; // human-readable result or the gateway's error
}

// Integration is a third-party provider's credential set. Secret values (password/token)
// are blanked on read; `configured` reports whether the provider has been set up.
message Integration {
  string provider = 1;            // e.g. "playmobile"
  map<string, string> values = 2; // key -> value; secret keys returned blank
  bool configured = 3;
}
message ListIntegrationsRequest {}
message ListIntegrationsResponse {
  repeated Integration integrations = 1;
}
message GetIntegrationRequest {
  string provider = 1;
}
message UpdateIntegrationRequest {
  string provider = 1;
  map<string, string> values = 2; // empty secret value keeps the stored one
}
// IntegrationConfig carries a provider's UNMASKED values for internal use.
message IntegrationConfig {
  map<string, string> values = 1;
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_TELEGRAM = 1;
  CHANNEL_SMS = 2;
}

enum Template {
  TEMPLATE_UNSPECIFIED = 0;
  TEMPLATE_OTP = 1;
  TEMPLATE_MECHANIC_INVITE = 2;
  TEMPLATE_ESTIMATE = 3;
  TEMPLATE_READY_FOR_PICKUP = 4;
  TEMPLATE_RECEIPT = 5;
}

message SendResponse {
  string id = 1;
  Channel channel = 2;
  bool delivered = 3;
}

message SendSmsRequest {
  string shop_id = 1;
  string phone = 2;
  string body = 3;
}

message SendTelegramRequest {
  string shop_id = 1;
  string telegram_handle = 2;
  string body = 3;
}
// SendReceiptRequest carries the facts the caption is built from rather than a
// finished sentence, so the wording stays in the notification service's own
// translation table alongside every other push.
message SendReceiptRequest {
  string shop_id = 1;
  string chat_id = 2;       // the customer's linked Telegram chat
  string document_url = 3;  // the rendered PDF; Telegram fetches this itself
  string check_url = 4;     // the public check page, appended to the caption
  avtoms.common.v1.Language language = 5;
  bool is_sale = 6;         // counter sale vs work order, picks the caption
  // Whether the money is already in. An unpaid document is a bill to be settled and must
  // not thank the customer for a purchase they have not made yet.
  bool paid = 9;
  string number = 7;        // receipt number as shown to the customer
  int64 total = 8;          // tiyin
}

message NotifyRequest {
  string shop_id = 1;
  string customer_id = 2;
  Template template = 3;
  avtoms.common.v1.Language language = 4;
  map<string, string> params = 5;
}
