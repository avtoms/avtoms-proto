syntax = "proto3";

package avtoms.workorder.v1;

option go_package = "github.com/avtoms/proto/gen/go/avtoms/workorder/v1;workorderv1";

// WorkOrderService owns work orders, line items, the pricing menu, and time tracking (M3 + M4 + M5).
service WorkOrderService {
  rpc CreateWorkOrder(CreateWorkOrderRequest) returns (WorkOrder);
  rpc GetWorkOrder(GetWorkOrderRequest) returns (WorkOrder);
  rpc AddLineItem(AddLineItemRequest) returns (WorkOrder);
  rpc UpdateLineItem(UpdateLineItemRequest) returns (WorkOrder);
  rpc RemoveLineItem(RemoveLineItemRequest) returns (WorkOrder);
  rpc TransitionState(TransitionStateRequest) returns (WorkOrder);
  rpc AssignMechanic(AssignMechanicRequest) returns (WorkOrder);
  rpc AssignLineItem(AssignLineItemRequest) returns (WorkOrder);
  rpc SetLineItemStatus(SetLineItemStatusRequest) returns (WorkOrder);
  rpc SetOrderDiscount(SetOrderDiscountRequest) returns (WorkOrder);
  // SetWorkOrderNotes replaces the order's free-text note. The note is internal to the
  // shop: it is not printed on the customer's check.
  rpc SetWorkOrderNotes(SetWorkOrderNotesRequest) returns (WorkOrder);
  // The odometer reading taken at this visit. Separate from creation because the reading is
  // often taken later — when the car is on the ramp, or when it is handed back.
  rpc SetWorkOrderOdometer(SetWorkOrderOdometerRequest) returns (WorkOrder);
  // The car's service book: every visit, what was done, and how far it had gone by then.
  rpc GetServiceBook(GetServiceBookRequest) returns (ServiceBook);

  rpc StartTimer(StartTimerRequest) returns (TimeEntry);
  rpc StopTimer(StopTimerRequest) returns (TimeEntry);

  rpc ListMenuItems(ListMenuItemsRequest) returns (ListMenuItemsResponse);
  rpc CreateMenuItem(CreateMenuItemRequest) returns (MenuItem);
  rpc UpdateMenuItem(UpdateMenuItemRequest) returns (MenuItem);
  rpc ListMenuPriceHistory(ListMenuPriceHistoryRequest) returns (ListMenuPriceHistoryResponse);

  rpc ListWorkOrders(ListWorkOrdersRequest) returns (ListWorkOrdersResponse);

  // Per-shop pricing policy (currently the negotiated-discount cap).
  rpc GetShopSettings(GetShopSettingsRequest) returns (ShopSettings);
  rpc UpdateShopSettings(UpdateShopSettingsRequest) returns (ShopSettings);

  // Warehouse products (with properties and variants). A product carries shared
  // catalog info plus named properties (Size, Color); each variant is a combination
  // of property values with its own SKU, cost, price and stock.
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  rpc AdjustVariantStock(AdjustVariantStockRequest) returns (ProductVariant);
  // Stock ledger (income/outcome) for one variant, newest first.
  rpc ListStockMovements(ListStockMovementsRequest) returns (ListStockMovementsResponse);

  // Counter sales: stock sold straight over the counter, with no work order, no
  // vehicle and no customer. Sales live here because this service owns the warehouse —
  // the stock leaves through the same movement ledger a work order uses, so a variant's
  // history stays one story. The money side (invoice, receipt, payment method) is the
  // invoice service's; the gateway composes the two.
  rpc CreateSale(CreateSaleRequest) returns (Sale);
  rpc ListSales(ListSalesRequest) returns (ListSalesResponse);
  rpc GetSale(GetSaleRequest) returns (Sale);
  // VoidSale puts the stock back on the shelf and marks the sale reversed — all of it, or
  // the part the buyer actually brought back (see material_settlement). Idempotent: voiding
  // an already-voided sale returns it unchanged rather than double-restocking.
  rpc VoidSale(VoidSaleRequest) returns (Sale);
  // SetSaleInvoice links the invoice the gateway generated back to the sale.
  rpc SetSaleInvoice(SetSaleInvoiceRequest) returns (Sale);

  // Predefined product-property catalog (global, admin-managed). Any authenticated
  // user may list them to populate the product form; only admins mutate them.
  rpc ListPropertyDefinitions(ListPropertyDefinitionsRequest) returns (ListPropertyDefinitionsResponse);
  rpc CreatePropertyDefinition(CreatePropertyDefinitionRequest) returns (PropertyDefinition);
  rpc UpdatePropertyDefinition(UpdatePropertyDefinitionRequest) returns (PropertyDefinition);
  rpc DeletePropertyDefinition(DeletePropertyDefinitionRequest) returns (DeletePropertyDefinitionResponse);

  // Simple admin-managed term lists (brands, product categories) used as dropdowns.
  rpc ListCatalogTerms(ListCatalogTermsRequest) returns (ListCatalogTermsResponse);
  rpc CreateCatalogTerm(CreateCatalogTermRequest) returns (CatalogTerm);
  rpc UpdateCatalogTerm(UpdateCatalogTermRequest) returns (CatalogTerm);
  rpc DeleteCatalogTerm(DeleteCatalogTermRequest) returns (DeleteCatalogTermResponse);

  // Contragents: counterparties the shop transacts with — chiefly suppliers
  // ("yetkazib beruvchi") that products are bought from. Shop-scoped; used as the
  // supplier dropdown on the product form.
  rpc ListContragents(ListContragentsRequest) returns (ListContragentsResponse);
  rpc CreateContragent(CreateContragentRequest) returns (Contragent);
  rpc UpdateContragent(UpdateContragentRequest) returns (Contragent);
  rpc DeleteContragent(DeleteContragentRequest) returns (DeleteContragentResponse);

  // Contragent accounts: what the shop owes a counterparty and what it has settled.
  // Buying stock already recorded who supplied it and what it cost; this turns that into a
  // running account, and adds the two things it was missing — paying a supplier without
  // buying anything, and knowing the balance.
  rpc ListContragentBalances(ListContragentBalancesRequest) returns (ListContragentBalancesResponse);
  rpc ListContragentLedger(ListContragentLedgerRequest) returns (ListContragentLedgerResponse);
  rpc RecordContragentEntry(RecordContragentEntryRequest) returns (ContragentLedgerEntry);
  rpc DeleteContragentEntry(DeleteContragentEntryRequest) returns (DeleteContragentResponse);

  // Customer accounts: what clients owe the shop for anything taken on credit ("nasiya").
  rpc ListCustomerBalances(ListCustomerBalancesRequest) returns (ListCustomerBalancesResponse);
  rpc ListCustomerLedger(ListCustomerLedgerRequest) returns (ListCustomerLedgerResponse);
  rpc RecordCustomerEntry(RecordCustomerEntryRequest) returns (CustomerLedgerEntry);
  rpc DeleteCustomerEntry(DeleteCustomerEntryRequest) returns (DeleteCustomerEntryResponse);

  // Appointments / scheduling.
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse);
  rpc CreateAppointment(CreateAppointmentRequest) returns (Appointment);
  rpc SetAppointmentState(SetAppointmentStateRequest) returns (Appointment);

  // Per-work-order audit trail.
  rpc GetAuditLog(GetAuditLogRequest) returns (GetAuditLogResponse);

  // Service reminders (next oil change, inspection due, etc.).
  rpc ListServiceReminders(ListServiceRemindersRequest) returns (ListServiceRemindersResponse);
  rpc CreateServiceReminder(CreateServiceReminderRequest) returns (ServiceReminder);
  rpc SetServiceReminderState(SetServiceReminderStateRequest) returns (ServiceReminder);

  // Cross-shop due-queries + dedup, used by the notification scheduler to push reminders.
  rpc ListDueReminders(ListDueRemindersRequest) returns (ListServiceRemindersResponse);
  rpc MarkReminderNotified(MarkNotifiedRequest) returns (MarkNotifiedResponse);
  rpc ListDueAppointments(ListDueAppointmentsRequest) returns (ListAppointmentsResponse);
  rpc MarkAppointmentReminded(MarkNotifiedRequest) returns (MarkNotifiedResponse);

  // Shop overhead expenses + profit-and-loss.
  rpc ListShopExpenses(ListShopExpensesRequest) returns (ListShopExpensesResponse);
  rpc CreateShopExpense(CreateShopExpenseRequest) returns (ShopExpense);
  rpc DeleteShopExpense(DeleteShopExpenseRequest) returns (DeleteShopExpenseResponse);
  rpc GetProfitAndLoss(GetProfitAndLossRequest) returns (ProfitAndLoss);
  // GetStatistics answers the whole analytics screen in one call, computed live from this
  // service's own tables rather than from a projected read model — so it covers the shop's
  // entire history rather than only what has been observed since a projection shipped.
  // One RPC because the screen has one period selector: every figure must describe the
  // same window, and a fan-out of calls invites them to disagree.
  rpc GetStatistics(GetStatisticsRequest) returns (Statistics);

  // Warranties on completed work (months / km coverage per vehicle).
  rpc ListWarranties(ListWarrantiesRequest) returns (ListWarrantiesResponse);
  rpc CreateWarranty(CreateWarrantyRequest) returns (Warranty);
  rpc VoidWarranty(VoidWarrantyRequest) returns (Warranty);

  // Customer estimate approval via a shareable token (e.g. a Telegram deep link).
  rpc CreateApprovalLink(CreateApprovalLinkRequest) returns (ApprovalLink);
  rpc ResolveApproval(ResolveApprovalRequest) returns (ApprovalInfo);
  rpc DecideApproval(DecideApprovalRequest) returns (ApprovalInfo);
}

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_APPROVED = 2;
  APPROVAL_STATUS_DECLINED = 3;
}
// ApprovalLink is a freshly minted token for a work order's estimate.
message ApprovalLink {
  string token = 1;
  string work_order_id = 2;
}
// ApprovalInfo describes an approval token + a short estimate summary for display.
message ApprovalInfo {
  string token = 1;
  string work_order_id = 2;
  ApprovalStatus status = 3;
  int64 total = 4;            // estimate total (tiyin)
  int32 line_item_count = 5;
}
message CreateApprovalLinkRequest {
  string work_order_id = 1;
}
message ResolveApprovalRequest {
  string token = 1;
}
message DecideApprovalRequest {
  string token = 1;
  bool approved = 2;
}

// Warranty covers a repair/part for a period (months) and/or distance (km) from a start date.
message Warranty {
  string id = 1;
  string shop_id = 2;
  string vehicle_id = 3;     // the covered vehicle
  string work_order_id = 4;  // optional originating work order
  string title = 5;          // what is covered, e.g. "Brake pads", "Engine rebuild"
  int32 months = 6;          // coverage length in months (0 = none)
  int64 km_limit = 7;        // coverage distance in km (0 = none)
  string starts_on = 8;      // RFC3339 date coverage began
  string expires_on = 9;     // RFC3339 date coverage ends (computed: starts_on + months)
  string note = 10;
  bool voided = 11;
  string created_at = 12;
}
message ListWarrantiesRequest {
  string shop_id = 1;
  string vehicle_id = 2; // optional filter (a vehicle's warranties)
}
message ListWarrantiesResponse {
  repeated Warranty warranties = 1;
}
message CreateWarrantyRequest {
  string shop_id = 1;
  string vehicle_id = 2;
  string work_order_id = 3;
  string title = 4;
  int32 months = 5;
  int64 km_limit = 6;
  string starts_on = 7; // optional; defaults to now
  string note = 8;
}
message VoidWarrantyRequest {
  string id = 1;
}

// ShopExpense is a shop overhead cost (rent, salary, utilities, ...), distinct from
// the per-work-order material/part costs already tracked on line items.
message ShopExpense {
  string id = 1;
  string shop_id = 2;
  string category = 3;    // rent, salary, utilities, supplies, tax, other
  int64 amount = 4;       // tiyin
  string incurred_on = 5; // RFC3339 date the cost was incurred
  string note = 6;
  string created_at = 7;
  string staff_id = 8;    // optional: the worker this cost is for (e.g. whose salary)
  string payee = 9;       // optional: receiver/recipient of the payment (e.g. landlord, vendor)
  string paid_by = 10;    // optional: staff id of the person who made the payment

  // How the money left the shop. `method` and card_* describe the first part; `parts` carries
  // the whole split, and holds exactly one entry when the expense was paid a single way.
  // Rows written before any of this existed carry PAYMENT_METHOD_UNSPECIFIED and no parts,
  // which reads on screen as "not recorded" rather than as a guess.
  PaymentMethod method = 11;
  string card_id = 12;
  string card_number = 13;
  repeated PaymentPart parts = 14;
}
message ListShopExpensesRequest {
  string shop_id = 1;
  string from = 2; // RFC3339 lower bound (optional)
  string to = 3;   // RFC3339 upper bound (optional)
}
message ListShopExpensesResponse {
  repeated ShopExpense expenses = 1;
}
message CreateShopExpenseRequest {
  string shop_id = 1;
  string category = 2;
  int64 amount = 3;
  string incurred_on = 4;
  string note = 5;
  string staff_id = 6; // optional: worker this expense is for
  string payee = 7;    // optional: receiver/recipient
  string paid_by = 8;  // optional: staff id of the paying person

  // Either a single method (with card_id/card_number when it is CARD), or parts summing to
  // amount. Sending both is fine — parts win, and method is derived from the first of them.
  PaymentMethod method = 9;
  string card_id = 10;
  string card_number = 11;
  repeated PaymentPart parts = 12;
}
message DeleteShopExpenseRequest {
  string id = 1;
}
message DeleteShopExpenseResponse {
  bool deleted = 1;
}

// ExpenseBucket is one category's total in a P&L.
message ExpenseBucket {
  string category = 1;
  int64 amount = 2;
}
// ProfitAndLoss summarizes a period's economics for a shop.
message ProfitAndLoss {
  string shop_id = 1;
  string from = 2;
  string to = 3;
  int64 revenue = 4;        // sum of work-order subtotals (pre-VAT) for invoiced/closed orders in range
  int64 cost_of_goods = 5;  // sum of line-item costs (parts/materials) on those orders
  int64 gross_margin = 6;   // revenue - cost_of_goods
  int64 overhead = 7;       // sum of shop expenses in range
  int64 net_profit = 8;     // gross_margin - overhead
  int32 work_order_count = 9;
  repeated ExpenseBucket by_category = 10; // overhead broken down by category
}
message GetProfitAndLossRequest {
  string shop_id = 1;
  string from = 2; // RFC3339 lower bound (optional)
  string to = 3;   // RFC3339 upper bound (optional)
}

// ── statistics ──────────────────────────────────────────────────────────────────────
// Every figure below excludes cancelled work orders and voided sales: they describe what
// the shop actually did, not what it started and undid.

message GetStatisticsRequest {
  string shop_id = 1;
  string from = 2; // RFC3339 lower bound (optional)
  string to = 3;   // RFC3339 upper bound (optional)
}

// DayPoint is one day of trading, for the trend chart.
message DayPoint {
  string day = 1;    // YYYY-MM-DD
  int64 revenue = 2;
  int64 cost = 3;
  int32 orders = 4;
  int32 sales = 5;
}

// StateBucket is how many orders sit in one state and what they are worth.
message StateBucket {
  WorkOrderState state = 1;
  int32 count = 2;
  int64 value = 3;
}

// MechanicStat is one worker's contribution over the window. hours counts only finished
// timer entries — a timer still running has no duration to report yet.
message MechanicStat {
  string mechanic_id = 1;
  int32 jobs = 2;        // distinct work orders they finished a line on
  int32 lines_done = 3;
  double hours = 4;
  int64 revenue = 5;     // what their finished lines billed
  string name = 6;       // filled by the gateway from the staff list
}

// ItemStat ranks one thing sold — a service by name, or a product by variant.
message ItemStat {
  string key = 1;        // variant id for products; the description for services
  string name = 2;
  string sku = 3;
  double quantity = 4;   // may be fractional (3.5 l)
  int64 revenue = 5;
  int64 cost = 6;
  int64 margin = 7;
  int32 times = 8;       // how many separate lines sold it
}

// VehicleStat is one car's trading history with the shop. The identifying fields are filled
// by the gateway; this service only knows the id.
message VehicleStat {
  string vehicle_id = 1;
  int32 orders = 2;
  int64 revenue = 3;
  string first_at = 4;   // RFC3339, first order ever (not only within the window)
  string last_at = 5;
  string plate = 6;
  string make = 7;
  string model = 8;
  string customer_name = 9;
}

// PaymentBucket is income grouped by how it arrived. Filled by the gateway from the invoice
// service, which holds the payment side for both work orders and counter sales — so unlike
// a projection it covers the whole history.
message PaymentBucket {
  string method = 1;      // cash | card | other
  string card_id = 2;
  string card_number = 3;
  int64 amount = 4;
  int32 count = 5;
}

message Statistics {
  string shop_id = 1;
  string from = 2;
  string to = 3;

  // money (tiyin)
  int64 revenue = 4;          // order_revenue + sales_revenue
  int64 order_revenue = 5;    // invoiced/closed work orders, net of their discount
  int64 sales_revenue = 6;    // counter sales
  int64 cost_of_goods = 7;
  int64 gross_margin = 8;
  int64 overhead = 9;
  int64 net_profit = 10;
  int64 discounts_given = 11; // whole-order discounts on counted orders
  int64 avg_ticket = 12;
  int32 order_count = 13;
  int32 sale_count = 14;
  repeated DayPoint by_day = 15;
  repeated ExpenseBucket by_category = 16;

  // work
  repeated StateBucket funnel = 17;   // every state, including ones with no orders
  repeated MechanicStat mechanics = 18;
  double worked_hours = 19;
  // Average hours from an order being created to it being invoiced. Read from the audit
  // trail, so it covers only orders whose invoicing was recorded there.
  double avg_lead_time_hours = 20;

  // products & services
  repeated ItemStat top_services = 21;
  repeated ItemStat top_products = 22;  // materials fitted + counter sales, by variant
  int64 stock_value = 23;               // CURRENT on-hand value; not windowed
  int32 low_stock_count = 24;

  // customers & cars
  repeated VehicleStat top_vehicles = 25;
  int32 new_customers = 26;       // cars whose first-ever order falls inside the window
  int32 returning_customers = 27;

  // how the money arrived; filled by the gateway
  repeated PaymentBucket payments = 28;

  // Counterparty balances, all-time rather than windowed — a debt does not stop existing
  // because you looked at one month. Not part of net_profit: see ContragentEntryKind.
  int64 payable = 29;    // what the shop owes suppliers
  int64 receivable = 30; // what counterparties owe the shop
  // What CLIENTS owe for goods and work taken on credit. All-time like the two above, and
  // likewise outside net_profit: this money was already counted as revenue when the goods
  // went out — this line says how much of it has not arrived yet.
  int64 client_debt = 31;
  // How much of the window's revenue was taken on credit rather than collected. Part of
  // revenue, shown separately so "we billed 10m" and "we hold 10m" are not confused.
  int64 credit_revenue = 32;
}

enum ServiceReminderState {
  SERVICE_REMINDER_STATE_UNSPECIFIED = 0;
  SERVICE_REMINDER_STATE_PENDING = 1;
  SERVICE_REMINDER_STATE_DONE = 2;
  SERVICE_REMINDER_STATE_DISMISSED = 3;
}

// ServiceReminder is a future maintenance reminder for a vehicle (oil change,
// technical inspection, timing-belt, insurance renewal, ...).
message ServiceReminder {
  string id = 1;
  string shop_id = 2;
  string vehicle_id = 3;     // optional link to a vehicle
  string customer_name = 4;  // denormalized for display / SMS
  string phone = 5;          // denormalized for SMS
  string plate = 6;          // free-text plate for quick display
  string title = 7;          // e.g. "Oil change", "Technical inspection"
  string due_date = 8;       // RFC3339 date the service is due (optional)
  int64 due_mileage = 9;     // odometer target in km (optional, 0 = none)
  string notes = 10;
  ServiceReminderState state = 11;
  string created_at = 12;
  // Optional recurrence: when the reminder is completed, the next occurrence is created
  // automatically, advanced by repeat_months (calendar) and/or repeat_km (odometer).
  // 0 for both = one-off. series_id groups all occurrences of the same recurring reminder.
  int32 repeat_months = 13;
  int64 repeat_km = 14;
  string series_id = 15;
}
message ListServiceRemindersRequest {
  string shop_id = 1;
  string vehicle_id = 2; // optional filter (a vehicle's reminders)
}
message ListServiceRemindersResponse {
  repeated ServiceReminder reminders = 1;
}
message CreateServiceReminderRequest {
  string shop_id = 1;
  string vehicle_id = 2;
  string customer_name = 3;
  string phone = 4;
  string plate = 5;
  string title = 6;
  string due_date = 7;
  int64 due_mileage = 8;
  string notes = 9;
  int32 repeat_months = 10; // optional recurrence (calendar months); 0 = one-off
  int64 repeat_km = 11;     // optional recurrence (odometer km); 0 = none
}
message SetServiceReminderStateRequest {
  string id = 1;
  ServiceReminderState state = 2;
}
message ListDueRemindersRequest {
  string now = 1; // RFC3339; pending reminders with due_date <= now and not yet notified
}
message ListDueAppointmentsRequest {
  string from = 1; // RFC3339; scheduled appointments within [from, to] not yet reminded
  string to = 2;
}
message MarkNotifiedRequest {
  string id = 1;
}
message MarkNotifiedResponse {
  bool ok = 1;
}

// AuditEntry records one change to a work order.
message AuditEntry {
  string id = 1;
  string work_order_id = 2;
  string actor_id = 3;   // staff id who made the change (from the gateway), may be empty
  string action = 4;     // e.g. "state", "line_added", "line_removed", "mechanic_assigned"
  string detail = 5;     // human-readable detail
  string created_at = 6; // RFC3339
}
message GetAuditLogRequest {
  string work_order_id = 1;
}
message GetAuditLogResponse {
  repeated AuditEntry entries = 1;
}

enum AppointmentState {
  APPOINTMENT_STATE_UNSPECIFIED = 0;
  APPOINTMENT_STATE_SCHEDULED = 1;
  APPOINTMENT_STATE_DONE = 2;
  APPOINTMENT_STATE_CANCELED = 3;
}

// Appointment is a booked job slot.
message Appointment {
  string id = 1;
  string shop_id = 2;
  string title = 3;             // service / reason
  string customer_name = 4;     // free text (walk-in or denormalized)
  string phone = 5;
  string vehicle_id = 6;        // optional link to a vehicle
  string plate = 7;             // free-text plate for quick display
  string mechanic_id = 8;       // optional assigned mechanic
  string scheduled_at = 9;      // RFC3339
  int32 duration_minutes = 10;
  AppointmentState state = 11;
  string notes = 12;
}
message ListAppointmentsRequest {
  string shop_id = 1;
  string from = 2; // RFC3339 lower bound (optional)
  string to = 3;   // RFC3339 upper bound (optional)
}
message ListAppointmentsResponse {
  repeated Appointment appointments = 1;
}
message CreateAppointmentRequest {
  string shop_id = 1;
  string title = 2;
  string customer_name = 3;
  string phone = 4;
  string vehicle_id = 5;
  string plate = 6;
  string mechanic_id = 7;
  string scheduled_at = 8;
  int32 duration_minutes = 9;
  string notes = 10;
}
message SetAppointmentStateRequest {
  string id = 1;
  AppointmentState state = 2;
}

// Product is a warehouse catalog entity. It carries shared info (name, unit,
// supplier, ...) plus a set of named properties whose value combinations define
// the variants that are actually counted and priced.
message Product {
  string id = 1;
  string shop_id = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  string unit = 6;            // unit of measure: dona, litr, kg, ...
  string supplier = 7;        // optional supplier/vendor name
  bool active = 8;
  repeated ProductProperty properties = 9;  // e.g. Size -> [S, M, L]
  repeated ProductVariant variants = 10;    // each combination, own price/stock
  string brand = 11;          // brand this product belongs to (e.g. "Bosch", "Shell")
  string supplier_id = 12;    // linked contragent (supplier) id; empty if free-typed only
}

// ProductProperty is a named option that defines variants, with its allowed values.
message ProductProperty {
  string id = 1;
  string name = 2;            // e.g. "Size"
  repeated string values = 3; // allowed values, e.g. ["S", "M", "L"]
}

// ProductVariant is the countable, priced stock unit: one combination of property
// values, with its own SKU, cost, price, on-hand quantity and reorder threshold.
message ProductVariant {
  string id = 1;
  string product_id = 2;
  string sku = 3;             // optional stock-keeping unit / article number
  double quantity_on_hand = 4;
  double reorder_level = 5;   // low-stock threshold; below this it's flagged
  int64 unit_cost = 6;        // buy price per unit (tiyin)
  int64 unit_price = 7;       // sell price per unit (tiyin)
  bool active = 8;
  repeated VariantAttribute attributes = 9; // {property:"Size", value:"M"}
}

// VariantAttribute records which value a variant has for one property.
message VariantAttribute {
  string property = 1;
  string value = 2;
}

message ListProductsRequest {
  string shop_id = 1;
}
message ListProductsResponse {
  repeated Product products = 1;
}
message GetProductRequest {
  string id = 1;
}
message CreateProductRequest {
  string shop_id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string unit = 5;
  string supplier = 6;
  repeated ProductProperty properties = 7;
  repeated ProductVariant variants = 8;
  string brand = 9;
  string supplier_id = 10;
  // Stock arriving with this product is a delivery from supplier_id, so it lands on that
  // supplier's account like any other. paid_amount is what was settled on the spot, tiyin;
  // zero means the whole delivery was taken on credit. skip_debt records the stock without
  // touching the account at all — for goods the shop already owned or a stocktake correction.
  int64 paid_amount = 11;
  bool skip_debt = 12;
  string staff_id = 13;  // who saved this (from JWT), recorded on any movement it writes
}
message UpdateProductRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string unit = 5;
  string supplier = 6;
  bool active = 7;
  repeated ProductProperty properties = 8;
  repeated ProductVariant variants = 9;
  string brand = 10;
  string supplier_id = 11;
  // Raising a variant's quantity here is a delivery, settled the same way as on create.
  int64 paid_amount = 12;
  bool skip_debt = 13;
  string staff_id = 14;  // who saved this (from JWT), recorded on any movement it writes
}
message AdjustVariantStockRequest {
  string variant_id = 1;
  double delta = 2;    // positive = receive stock, negative = consume/correct
  string reason = 3;   // free-text note (e.g. "received", "used", "stocktake")
  string staff_id = 4;      // who recorded this movement (from JWT); empty for system moves
  string contragent_id = 5; // supplier who delivered (income only); optional
  int64 unit_cost = 6;      // purchase price per unit for this receipt, tiyin (income only)
  // How much of this delivery was settled on the spot, tiyin (income only). The rest becomes
  // debt on the supplier's account. Zero means the whole delivery was taken on credit.
  int64 paid_amount = 7;
}

// StockMovement is one entry in a variant's income/outcome ledger.
message StockMovement {
  string id = 1;
  string variant_id = 2;
  double delta = 3;          // positive = income (received), negative = outcome (consumed)
  string reason = 4;
  double balance_after = 5;  // on-hand quantity right after this movement
  string created_at = 6;     // RFC3339
  string staff_id = 7;       // who recorded it (resolve name from the staff list)
  string contragent_id = 8;  // supplier who delivered (income); resolve name from contragents
  int64 unit_cost = 9;       // purchase price per unit for this receipt, tiyin

  // Which document moved the stock. "The oil went out on a job" is only half an answer: a
  // shelf that no longer matches the count is traced by opening the job it went out on.
  //
  // Empty on a movement that has no document behind it — opening stock, a hand-made
  // adjustment — and on work-order movements recorded before this was kept, since nothing
  // links those rows to an order after the fact.
  string source_kind = 10;   // "work_order" | "sale" | "" (none)
  string source_id = 11;     // the work order or sale, for opening it
  string source_no = 12;     // what it is called on screen: "Z-0013", "S-0003"
}
message ListStockMovementsRequest {
  string variant_id = 1;
}
message ListStockMovementsResponse {
  repeated StockMovement movements = 1;
}

// ── Counter sales ───────────────────────────────────────────────────────────────────
// PaymentMethod mirrors avtoms.invoice.v1.PaymentMethod value for value. Services do not
// import each other's protos, so the sale keeps its own copy of how the money arrived;
// the gateway maps between the two when it generates the sale's invoice. Keep the numbers
// in step with the invoice enum — the reporting breakdown groups on them.
enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CASH = 1;
  PAYMENT_METHOD_OTHER = 2;
  PAYMENT_METHOD_CARD = 3;
  // Sold on credit ("nasiya"): the goods left, no money arrived, and the buyer owes it.
  // The sale still counts as revenue — the shop earned it the moment the goods went out —
  // and the amount owed is carried on the buyer's customer_ledger account until they pay.
  // Because nobody can owe a debt anonymously, a credit sale REQUIRES a customer_id.
  //
  // Kept numerically identical to invoice.v1.PaymentMethod: the gateway casts one to the
  // other when it issues a sale's receipt, so the two enums must never drift apart.
  PAYMENT_METHOD_CREDIT = 4;
}

// PaymentPart is one leg of a payment that arrived, or left, in more than one form: part
// cash and part card. It is deliberately the same shape as invoice.v1.PaymentPart, because
// a shop settling a bill and a shop paying its landlord are answering the same question and
// should not have to learn two answers.
//
// Anywhere it appears, the row it hangs off keeps a single `method` as well, describing the
// FIRST part. That is what lets everything already reading one method off a row keep working
// while the parts carry the truth.
message PaymentPart {
  int64 amount = 1;      // tiyin, always positive
  PaymentMethod method = 2;
  string card_id = 3;    // for CARD: the shop card the money moved through
  string card_number = 4;
}

// SaleItem is one line of a counter sale: a warehouse variant, how much of it left, and
// what it was actually sold for. Description, sku and unit_cost are snapshots taken at
// sale time, so renaming or repricing the product later cannot rewrite history.
message SaleItem {
  string id = 1;
  string variant_id = 2;
  string description = 3;
  double quantity = 4;    // may be fractional (3.5 l, 0.75 kg)
  int64 unit_price = 5;   // agreed sell price per unit, tiyin
  int64 unit_cost = 6;    // the variant's buy price at sale time, tiyin
  string sku = 7;
}

message Sale {
  string id = 1;
  string shop_id = 2;
  int64 sale_no = 3;      // per-shop sequence, shown to users as "S-0001"
  string staff_id = 4;    // who sold it
  repeated SaleItem items = 5;
  // total is what was actually charged: subtotal minus discount_amount. It stays the field
  // everything downstream reads — the receipt, the reporting projection and the void reversal
  // all take this one, so a discount reaches them without any of them knowing about discounts.
  int64 total = 6;        // subtotal - discount_amount, tiyin
  int64 total_cost = 7;   // sum of unit_cost * quantity, tiyin — what the goods cost, never discounted
  PaymentMethod payment_method = 8;
  string card_id = 9;     // saved shop card the money landed on (card payments)
  string card_number = 10;
  string invoice_id = 11; // the receipt generated for this sale
  string note = 12;
  bool voided = 13;
  string voided_at = 14;  // RFC3339
  string created_at = 15; // RFC3339
  // A discount on the whole sale, the same shape a work order uses: discount_value is tiyin
  // (fixed) or basis points (percent, 100 = 1%), and discount_amount is the resulting
  // reduction, already taken off total.
  int64 subtotal = 16;    // sum of unit_price * quantity, before the discount
  DiscountKind discount_kind = 17;
  int64 discount_value = 18;
  int64 discount_amount = 19;
  // Optional: who bought it. A walk-in leaves this empty and sells exactly as before —
  // it exists so a counter sale has somewhere to send the receipt.
  string customer_id = 20;
  // How much of this sale was taken on credit, when only part of it was: a customer paying
  // 300 000 in cash and leaving 200 000 on their account has credit_amount = 200000 and
  // payment_method = CASH. This is what goes on their account, not total.
  //
  // Zero with payment_method = CREDIT means the whole sale was on credit, which is what every
  // sale recorded before splitting existed was.
  //
  // How the paid part was actually split lives on the invoice, which owns the money. The sale
  // keeps only what it needs to bill the right person the right amount.
  int64 credit_amount = 21;
}

// CreateSaleRequest sells stock. Only variant_id, quantity and unit_price are read from
// each item — description, sku and unit_cost are taken from the warehouse, not the caller.
message CreateSaleRequest {
  string shop_id = 1;
  string staff_id = 2;
  repeated SaleItem items = 3;
  PaymentMethod payment_method = 4;
  string card_id = 5;
  string card_number = 6;
  string note = 7;
  // A discount on the whole basket. discount_value is tiyin (fixed) or basis points (percent).
  DiscountKind discount_kind = 8;
  int64 discount_value = 9;
  // Set by the gateway from the caller's role: an owner may go past the shop's discount cap,
  // a worker on the counter may not. Never trusted from the request body.
  bool allow_discount_override = 10;
  string customer_id = 11; // optional; set to send this sale's receipt to a customer
  // The credit part of a split payment, in tiyin. Requires customer_id, exactly as a wholly
  // credit sale does — goods leaving against nobody's name is a hole in the till.
  int64 credit_amount = 12;
}
message ListSalesRequest {
  string shop_id = 1;
  string from = 2; // RFC3339, inclusive; empty = no lower bound
  string to = 3;   // RFC3339, inclusive; empty = no upper bound
}
message ListSalesResponse {
  repeated Sale sales = 1;
}
message GetSaleRequest {
  string id = 1;
}
message VoidSaleRequest {
  string id = 1;
  string staff_id = 2;
  // What the buyer actually brought back. Absent restocks the whole sale, which is what
  // voiding has always done — goods that were never returned, or came back damaged, need
  // this field to say so.
  MaterialSettlement material_settlement = 3;
}
message SetSaleInvoiceRequest {
  string id = 1;
  string invoice_id = 2;
}

// PropertyDefinition is a predefined, admin-managed property a product can use
// (e.g. "Color", "Viscosity", "Volume"). Its kind drives how the product form
// captures values: number = free numeric entry (with unit); select/color = pick
// from the predefined values below; text = free text.
message PropertyDefinition {
  string id = 1;
  // Canonical name and the stable identifier: a product's properties reference the catalog
  // by this string, so it must not change once in use. Display uses the translations below,
  // falling back to this when a translation is blank.
  string name = 2;
  string kind = 3;            // "text" | "number" | "select" | "color"
  string unit = 4;            // for number kind, e.g. "L", "mm", "kg", "Ah"
  int32 position = 5;
  bool active = 6;
  repeated PropertyDefinitionValue values = 7; // for select/color kinds
  // Admin-editable display names per language (blank = fall back to name).
  string name_uz_latn = 8;
  string name_uz_cyrl = 9;
  string name_ru = 10;
}

// PropertyDefinitionValue is one predefined value in a select/color property.
message PropertyDefinitionValue {
  string id = 1;
  // Canonical value and the stable identifier stored on a product's variants. Display uses
  // the translations below, falling back to this when a translation is blank.
  string value = 2;           // label, e.g. "Red", "5W-30"
  string color_hex = 3;       // for color kind, e.g. "#E11D48"
  int32 position = 4;
  // Admin-editable display values per language (blank = fall back to value).
  string value_uz_latn = 5;
  string value_uz_cyrl = 6;
  string value_ru = 7;
}

message ListPropertyDefinitionsRequest {
  bool include_inactive = 1;  // admin panel passes true; the product form omits it
}
message ListPropertyDefinitionsResponse {
  repeated PropertyDefinition definitions = 1;
}
message CreatePropertyDefinitionRequest {
  string name = 1;
  string kind = 2;
  string unit = 3;
  repeated PropertyDefinitionValue values = 4;
  string name_uz_latn = 5;
  string name_uz_cyrl = 6;
  string name_ru = 7;
}
message UpdatePropertyDefinitionRequest {
  string id = 1;
  // Renaming a property in use would orphan the products referencing it, so the canonical
  // name is only applied when it is still free; translations are always editable.
  string name = 2;
  string kind = 3;
  string unit = 4;
  bool active = 5;
  repeated PropertyDefinitionValue values = 6;
  string name_uz_latn = 7;
  string name_uz_cyrl = 8;
  string name_ru = 9;
}
message DeletePropertyDefinitionRequest {
  string id = 1;
}
message DeletePropertyDefinitionResponse {
  bool ok = 1;
}

// CatalogTerm is one entry in an admin-managed term list (e.g. a brand or a
// product category). type groups the list ("brand", "category").
message CatalogTerm {
  string id = 1;
  string type = 2;   // "brand" | "category"
  string name = 3;
  int32 position = 4;
  bool active = 5;
  string logo_url = 6; // optional brand logo (superadmin-uploaded); empty for categories
}
message ListCatalogTermsRequest {
  string type = 1;             // required: which list to return
  bool include_inactive = 2;   // admin panel passes true; the product form omits it
}
message ListCatalogTermsResponse {
  repeated CatalogTerm terms = 1;
}
message CreateCatalogTermRequest {
  string type = 1;
  string name = 2;
  string logo_url = 3;
}
message UpdateCatalogTermRequest {
  string id = 1;
  string name = 2;
  bool active = 3;
  string logo_url = 4;
}
message DeleteCatalogTermRequest {
  string id = 1;
}
message DeleteCatalogTermResponse {
  bool ok = 1;
}

// Contragent is a counterparty the shop transacts with — chiefly a supplier
// ("yetkazib beruvchi") that products are bought from. Shop-scoped so each shop
// keeps its own supplier list.
message Contragent {
  string id = 1;
  string shop_id = 2;
  string name = 3;
  string phone = 4;
  string address = 5;
  string notes = 6;
  bool active = 7;
  string brand = 8;  // optional brand this supplier is tied to (matches Product.brand by name)
}
message ListContragentsRequest {
  string shop_id = 1;
  bool include_inactive = 2;  // management page passes true; the product form omits it
}
message ListContragentsResponse {
  repeated Contragent contragents = 1;
}
message CreateContragentRequest {
  string shop_id = 1;
  string name = 2;
  string phone = 3;
  string address = 4;
  string notes = 5;
  string brand = 6;
}
message UpdateContragentRequest {
  string id = 1;
  string name = 2;
  string phone = 3;
  string address = 4;
  string notes = 5;
  bool active = 6;
  string brand = 7;
}
message DeleteContragentRequest {
  string id = 1;
}
message DeleteContragentResponse {
  bool ok = 1;
}

// ── contragent accounts ─────────────────────────────────────────────────────────────
// One signed ledger per counterparty. Amounts are ALWAYS positive and the direction lives
// in the kind, so a row reads as an event rather than as a negative number someone has to
// interpret. The balance is the signed sum, and POSITIVE MEANS WE OWE THEM.
//
// Deliberately not part of profit and loss. A part's cost already reaches profit once, when
// it is fitted to a car or sold over the counter; subtracting the payment to the supplier as
// well would count the same money twice and make the shop look less profitable than it is.
// This is debt and cash movement, and nothing here touches ProfitAndLoss.
enum ContragentEntryKind {
  CONTRAGENT_ENTRY_KIND_UNSPECIFIED = 0;
  CONTRAGENT_ENTRY_KIND_PURCHASE = 1;    // goods received from them        → +
  CONTRAGENT_ENTRY_KIND_PAYMENT_OUT = 2; // we paid them                    → −
  CONTRAGENT_ENTRY_KIND_CHARGE = 3;      // goods/services given to them    → −
  CONTRAGENT_ENTRY_KIND_PAYMENT_IN = 4;  // they paid us                    → +
}

message ContragentLedgerEntry {
  string id = 1;
  string shop_id = 2;
  string contragent_id = 3;
  ContragentEntryKind kind = 4;
  int64 amount = 5;         // tiyin, always positive
  string description = 6;   // snapshot, e.g. "Motor oil 5W-30 · 4 l × 10"
  string movement_id = 7;   // the stock movement a purchase came from, when it had one
  PaymentMethod method = 8; // payments only
  string staff_id = 9;
  string occurred_at = 10;  // RFC3339 — when it happened, which may not be when it was typed
  string note = 11;
  string created_at = 12;

  string card_id = 13;    // for CARD payments: the shop card the money moved through
  string card_number = 14;
  repeated PaymentPart parts = 15; // the whole split; one entry when paid a single way
}

// ContragentBalance is one counterparty's account. balance = purchased + received
// − paid − charged; positive means the shop owes them.
message ContragentBalance {
  string contragent_id = 1;
  string name = 2;
  int64 purchased = 3;
  int64 paid = 4;
  int64 charged = 5;
  int64 received = 6;
  int64 balance = 7;
  string last_at = 8;   // most recent movement on the account, RFC3339
  int32 entries = 9;
}

message ListContragentBalancesRequest {
  string shop_id = 1;
  // The window narrows the per-kind totals. The BALANCE ignores it and is always all-time:
  // a debt does not stop existing because you looked at a single month.
  string from = 2;
  string to = 3;
}
message ListContragentBalancesResponse {
  repeated ContragentBalance balances = 1;
  int64 total_payable = 2;    // summed over counterparties we owe
  int64 total_receivable = 3; // summed over counterparties who owe us
}

message ListContragentLedgerRequest {
  string contragent_id = 1;
  string from = 2;
  string to = 3;
}
message ListContragentLedgerResponse {
  repeated ContragentLedgerEntry entries = 1; // newest first
  ContragentBalance summary = 2;
}

message RecordContragentEntryRequest {
  string contragent_id = 1;
  ContragentEntryKind kind = 2;
  int64 amount = 3;
  PaymentMethod method = 4;
  string note = 5;
  string occurred_at = 6; // RFC3339; empty means now
  string staff_id = 7;    // from the token, at the gateway
  string description = 8;

  string card_id = 9;
  string card_number = 10;
  repeated PaymentPart parts = 11; // parts summing to amount; method is taken from the first
}
message DeleteContragentEntryRequest {
  string id = 1;
}

// ── customer accounts (nasiya) ───────────────────────────────────────────────────────
// The mirror image of the contragent ledger, for the other side of the counter: what
// CUSTOMERS owe the shop. A sale or an order settled on credit writes a charge here, and
// every repayment writes a payment against it.
//
// The sign convention is flipped from the contragent one on purpose, because the question
// being asked is different. There it was "how much do we owe this supplier"; here it is
// "how much does this client owe us", and POSITIVE MEANS THE CLIENT OWES THE SHOP. Both
// screens then read the same way round: a big positive number is money you are waiting on.
//
// This is debt and cash movement, NOT revenue. The revenue was already recognised when the
// goods went out and the invoice was raised; counting the repayment as income as well would
// book the same money twice.
enum CustomerEntryKind {
  CUSTOMER_ENTRY_KIND_UNSPECIFIED = 0;
  CUSTOMER_ENTRY_KIND_CHARGE = 1;      // sold to them on credit           → +
  CUSTOMER_ENTRY_KIND_PAYMENT_IN = 2;  // they paid off some of the debt   → −
}

message CustomerLedgerEntry {
  string id = 1;
  string shop_id = 2;
  string customer_id = 3;
  CustomerEntryKind kind = 4;
  int64 amount = 5;          // tiyin, always positive
  string description = 6;    // snapshot, e.g. "S-0042 · 3 dona"
  string sale_id = 7;        // the counter sale a charge came from, when it had one
  string work_order_id = 8;  // the order a charge came from, when it had one
  string invoice_id = 9;
  PaymentMethod method = 10; // how a repayment arrived; payments only
  string staff_id = 11;
  string occurred_at = 12;   // RFC3339 — when it happened, not when it was typed
  string note = 13;
  string created_at = 14;
  // What the sale or order above is called on screen: "S-0042", "Z-0013". Resolved on read
  // rather than stored, so a row written before this existed still names its document.
  string source_no = 15;

  string card_id = 16;    // for CARD repayments: the shop card the money landed on
  string card_number = 17;
  repeated PaymentPart parts = 18; // the whole split; one entry when paid a single way
}

// CustomerBalance is one client's account. balance = charged − paid; positive means the
// client owes the shop.
message CustomerBalance {
  string customer_id = 1;
  int64 charged = 2;
  int64 paid = 3;
  int64 balance = 4;
  string last_at = 5;  // most recent movement on the account, RFC3339
  int32 entries = 6;
  // Denormalized for display, filled in by the GATEWAY from the customer service — this
  // service does not own customers and leaves both empty.
  string name = 7;
  string phone = 8;
}

message ListCustomerBalancesRequest {
  string shop_id = 1;
  // The window narrows charged/paid. The BALANCE ignores it and is always all-time: a debt
  // does not stop existing because you looked at a single month.
  string from = 2;
  string to = 3;
}
message ListCustomerBalancesResponse {
  repeated CustomerBalance balances = 1; // most in debt first
  int64 total_receivable = 2;            // summed over clients who owe the shop
}

message ListCustomerLedgerRequest {
  string customer_id = 1;
  string from = 2;
  string to = 3;
}
message ListCustomerLedgerResponse {
  repeated CustomerLedgerEntry entries = 1; // newest first
  CustomerBalance summary = 2;
}

message RecordCustomerEntryRequest {
  string shop_id = 1;
  string customer_id = 2;
  CustomerEntryKind kind = 3;
  int64 amount = 4;
  PaymentMethod method = 5;
  string note = 6;
  string occurred_at = 7; // RFC3339; empty means now
  string staff_id = 8;    // from the token, at the gateway
  string description = 9;
  // Set when the charge is raised by closing an order on credit, so voiding or re-paying
  // that order can find its entry again instead of leaving a duplicate debt behind.
  string work_order_id = 10;
  string invoice_id = 11;

  string card_id = 12;
  string card_number = 13;
  repeated PaymentPart parts = 14; // parts summing to amount; method is taken from the first
}
message DeleteCustomerEntryRequest {
  string id = 1;
}
message DeleteCustomerEntryResponse {
  bool ok = 1;
}

// ShopSettings holds per-shop policy: pricing, and which statuses the shop's work orders
// move through.
message ShopSettings {
  string shop_id = 1;
  // Maximum discount a mechanic may apply to a menu-priced line, in percent (0-100).
  // 100 means no cap (the opt-in default). Owners/admins always bypass the cap.
  int32 max_discount_percent = 2;
  // The statuses this shop's work orders move through. Empty means every status is enabled
  // (the default, so existing shops are unaffected). DRAFT, READY, INVOICED, CLOSED and
  // CANCELED are always in force — the server folds them back in if omitted — because order
  // creation, the mechanic's done-roll-up, invoicing and revenue reporting depend on them.
  // Legal transitions are derived from this set: the next enabled state after the current
  // one, so disabling ESTIMATED and APPROVED makes DRAFT go straight to IN_PROGRESS.
  repeated WorkOrderState enabled_states = 3;
  // Shop identity as it appears on a printed or sent receipt. It lives here because
  // this is already the shop's per-shop configuration; before this it existed only in
  // one browser's localStorage, which a server-rendered receipt cannot reach.
  string name = 4;
  string address = 5;
  string tin = 6;     // STIR / INN
  string phone = 7;
  string hours = 8;   // opening hours, as printed on the check
}
message GetShopSettingsRequest {
  string shop_id = 1;
}
message UpdateShopSettingsRequest {
  string shop_id = 1;
  int32 max_discount_percent = 2;
  repeated WorkOrderState enabled_states = 3;
  string name = 4;
  string address = 5;
  string tin = 6;
  string phone = 7;
  string hours = 8;
}

message ListWorkOrdersRequest {
  string shop_id = 1;
  WorkOrderState state = 2; // optional filter; UNSPECIFIED (0) returns all
  string assigned_mechanic_id = 3; // optional filter (for mechanic kanban)
  string vehicle_id = 4; // optional filter — a vehicle's service history
}
message ListWorkOrdersResponse {
  repeated WorkOrder work_orders = 1;
}

enum WorkOrderState {
  WORK_ORDER_STATE_UNSPECIFIED = 0;
  WORK_ORDER_STATE_DRAFT = 1;
  WORK_ORDER_STATE_ESTIMATED = 2;
  WORK_ORDER_STATE_APPROVED = 3;
  WORK_ORDER_STATE_IN_PROGRESS = 4;
  WORK_ORDER_STATE_READY = 5;
  WORK_ORDER_STATE_INVOICED = 6;
  WORK_ORDER_STATE_CLOSED = 7;
  WORK_ORDER_STATE_CANCELED = 8;
}

enum LineItemKind {
  LINE_ITEM_KIND_UNSPECIFIED = 0;
  LINE_ITEM_KIND_LABOR = 1; // deprecated alias kept for backward compatibility; prefer SERVICE
  LINE_ITEM_KIND_PART = 2;  // deprecated alias kept for backward compatibility; prefer MATERIAL
  LINE_ITEM_KIND_SERVICE = 3;  // a repair service performed (price negotiable per customer)
  LINE_ITEM_KIND_MATERIAL = 4; // a material/tool/part consumed during the repair (an expense)
}

// LineItemStatus is the per-service progress a mechanic drives. When every SERVICE line on an
// order is DONE, the order auto-transitions to READY.
enum LineItemStatus {
  LINE_ITEM_STATUS_UNSPECIFIED = 0;
  LINE_ITEM_STATUS_PENDING = 1;      // not started (default)
  LINE_ITEM_STATUS_IN_PROGRESS = 2;  // the assigned mechanic is working on it
  LINE_ITEM_STATUS_DONE = 3;         // finished
}

message LineItem {
  string id = 1;
  LineItemKind kind = 2;
  string description = 3;
  // What the customer is charged per unit, in minor units (tiyin). For a SERVICE this is the
  // agreed/negotiated price, which may be below the menu default (see default_price).
  int64 unit_price = 4;
  // Billed quantity per unit price. A whole number for services; may be fractional for a
  // material (e.g. 1.5 litres of oil), so the line total is unit_price * quantity, rounded.
  double quantity = 5;
  // The shop's expense (buy/cost price) per unit, in tiyin. 0 when not tracked.
  // Per-line margin is (unit_price - cost) * quantity.
  int64 cost = 6;
  // Optional source menu item this line was created from (empty for ad-hoc lines).
  string menu_item_id = 7;
  // Snapshot of the menu item's default_price when the line was added, in tiyin.
  // Enables a negotiation/discount audit: discount = (default_price - unit_price) * quantity.
  int64 default_price = 8;
  // Mechanic assigned to this specific service line (empty = unassigned). Lets one order be
  // split across mechanics (e.g. polishing → A, engine → B), independent of the order lead.
  string assigned_mechanic_id = 9;
  // Per-service progress the assigned mechanic drives; all SERVICE lines DONE → order READY.
  LineItemStatus status = 10;
  // Warehouse variant this material was drawn from (empty for non-stock lines). When set on a
  // MATERIAL line, adding the line decrements that variant's stock and removing it restores it.
  string variant_id = 11;
  // Exact amount drawn from stock for this material line, in the variant's unit — may be
  // fractional (e.g. 4.5 litres) and is independent of the billing `quantity`. This is what
  // adding the line deducts (and removing restores). 0 when the line consumes no stock.
  double consumed_qty = 12;
  // Which option of the menu item was sold (empty for a service with no options, and for a
  // line that did not come from the price list). The description carries the option's name for
  // reading; this carries the link, so renaming an option later cannot orphan the record of
  // what was actually sold.
  string menu_option_id = 13;
  // Unit of measure this line is billed in — the symbol, not a word: "pcs", "L", "kg".
  // It is a snapshot of the product's unit at the moment the line was added, for the same
  // reason default_price is: changing a product's unit later must not rewrite what an old
  // order says was sold.
  //
  // It is a separate field rather than part of the description because the description is
  // read in three languages and the unit has to be spelled the reader's way ("dona", "дона",
  // "шт"). A unit written into the description can only ever be spelled one way.
  // Empty means the unit was not recorded, and nothing is shown.
  string unit = 14;
}

message WorkOrder {
  string id = 1;
  string shop_id = 2;
  string vehicle_id = 3;
  string assigned_mechanic_id = 4;
  WorkOrderState state = 5;
  repeated LineItem line_items = 6;
  int64 subtotal = 7;
  int64 vat = 8;
  int64 total = 9;
  string notes = 10;
  string created_at = 11;
  // Set when a timer is currently running on this work order (the open time entry's start).
  string active_timer_started_at = 12;
  // Denormalized vehicle + customer info, filled by the gateway for display (read-only).
  string plate = 13;
  string make = 14;
  string model = 15;
  string customer_name = 16;
  string vehicle_image_url = 20; // denormalized car photo url, filled by the gateway
  // Sum of cost*quantity across line items, in tiyin: the shop's total expense on this order.
  int64 total_cost = 17;
  // Gross margin before VAT, in tiyin: subtotal - total_cost.
  int64 total_margin = 18;
  // Human-friendly per-shop sequential order number (1, 2, 3, …). Shown to users as
  // "Z-0001"; the UUID id stays the internal/API identifier.
  int64 order_no = 19;
  // Whole-order discount applied on top of any per-line negotiation. kind selects fixed vs
  // percent; discount_value is tiyin (fixed) or basis points (percent, 100 = 1%); and
  // discount_amount is the resulting reduction in tiyin, already reflected in total/margin.
  DiscountKind discount_kind = 21;
  int64 discount_value = 22;
  int64 discount_amount = 23;
  // Also denormalized by the gateway from the vehicle's owner. The id is what a credit
  // close charges the debt to, and the phone is what a service reminder is sent to — both
  // otherwise cost the caller two extra round trips to find.
  string customer_id = 24;
  string customer_phone = 25;
  // The odometer READING RECORDED FOR THIS VISIT, in km. Distinct from `mileage` below,
  // which is what the car reads today: this one is history and never changes once the visit
  // is over, which is exactly what makes a service book worth keeping.
  int64 odometer = 27;
  // The odometer reading on the vehicle, so a reminder set at closing time can be dated
  // "10 000 km from here" without a separate lookup.
  int64 mileage = 26;
}

// ── service book ────────────────────────────────────────────────────────────────────
// A car's history, the way a paper "сервисная книжка" reads: one line per visit, in order,
// saying how far the car had gone, what was done to it, and what it cost.
//
// Assembled here rather than in the browser because the interesting parts are differences
// between consecutive visits — how many kilometres and how many days since the last one —
// and those must be computed once, from the full ordered history, rather than three times
// over whatever subset a screen happens to have loaded.
message ServiceBookItem {
  string description = 1;
  LineItemKind kind = 2;
  double quantity = 3;
  int64 unit_price = 4;
  int64 total = 5;       // unit_price * quantity, rounded
}

message ServiceBookEntry {
  string work_order_id = 1;
  int64 order_no = 2;
  WorkOrderState state = 3;
  string occurred_at = 4;   // RFC3339: when the visit happened
  // The reading recorded at this visit, in km. 0 means nobody wrote it down — the screen
  // shows a gap rather than a number the shop cannot stand behind.
  int64 odometer = 5;
  // Distance since the previous visit that HAS a reading, in km. 0 when this is the first
  // such visit, or when either end of the comparison is missing.
  int64 odometer_delta = 6;
  int32 days_since_previous = 7;
  repeated ServiceBookItem items = 8;
  int64 total = 9;          // what the visit was charged, net of any discount
  string mechanic_id = 10;
  string mechanic_name = 11; // filled in by the gateway
  string notes = 12;
}

message ServiceBook {
  string vehicle_id = 1;
  repeated ServiceBookEntry entries = 2;  // newest first
  int32 visits = 3;
  int64 total_spent = 4;
  string first_visit = 5;   // RFC3339
  string last_visit = 6;
  // The latest recorded reading, which is the best answer to "how far has it gone" that the
  // shop's own records can give.
  int64 last_odometer = 7;
  // Average kilometres between visits, over the pairs where both readings exist. 0 when
  // there are not two such visits yet.
  int64 avg_km_between = 8;
  int32 avg_days_between = 9;
}

message GetServiceBookRequest {
  string shop_id = 1;
  string vehicle_id = 2;
}

// DiscountKind selects how a whole-order discount is expressed.
enum DiscountKind {
  DISCOUNT_KIND_UNSPECIFIED = 0; // no order discount
  DISCOUNT_KIND_FIXED = 1;       // discount_value is a fixed tiyin amount
  DISCOUNT_KIND_PERCENT = 2;     // discount_value is basis points (100 = 1%)
}

message TimeEntry {
  string id = 1;
  string work_order_id = 2;
  string mechanic_id = 3;
  string started_at = 4;
  string stopped_at = 5;
}

// MenuMaterial is a part/material a service is expected to consume (a bill-of-materials
// entry on a service template). Reference/spec data shown in the catalog; not auto-billed.
message MenuMaterial {
  string name = 1;
  double quantity = 2;  // amount, may be fractional (e.g. 4.5)
  int64 unit_cost = 3;  // shop expense per unit, in tiyin
  int64 unit_price = 4; // optional retail price per unit, in tiyin
  string unit = 5;      // free-text unit of measure: litr, kg, dona, metr, ...
  string variant_id = 6; // warehouse variant this material is drawn from (empty for ad-hoc)
}

// MenuItemOption is one way a service can be performed, at its own price: an oil change is
// the same job on a hatchback and on a jeep, and a different amount of money.
//
// A shop was modelling this by listing the same service several times ("Moy almashtirish —
// yengil", "Moy almashtirish — jip"), which reads as four services, sorts as four services,
// and reports as four services. One service with four options says what is actually true.
//
// The name is a single free-text field rather than the three the service itself carries. It is
// the shop's own words about its own price list — the same as a product name, a supplier or an
// expense category — and asking somebody to type "Krossover / Кроссовер / Кроссовер" for every
// option of every service produces empty fields, not translations.
message MenuItemOption {
  string id = 1;
  string name = 2;
  int64 price = 3;              // what this option sells for, in tiyin
  int64 cost = 4;               // the shop's expense for it, in tiyin (0 = not tracked)
  // Labour time for this option. 0 means "same as the service" rather than "instant" — a jeep
  // taking longer than a hatchback is exactly the sort of thing an option exists to say.
  int32 estimated_minutes = 5;
  int32 position = 6;           // the order the shop wants them listed in
  bool active = 7;
}

message MenuItem {
  string id = 1;
  string shop_id = 2;
  string name_uz_latn = 3;
  string name_uz_cyrl = 4;
  string name_ru = 5;
  int64 default_price = 6;
  bool active = 7;
  // Default shop expense (cost) for this menu item per unit, in tiyin. 0 when not tracked.
  // Seeds a line item's cost when it is created from this menu item.
  int64 default_cost = 8;
  // Service template details (real "canned job"): category, estimated labour time, and the
  // materials the repair is expected to need.
  string category = 9;
  int32 estimated_minutes = 10;
  repeated MenuMaterial materials = 11;
  // Named ways to perform this service, each with its own price. Empty for a service that is
  // simply one price, which is most of them and stays exactly as it was.
  repeated MenuItemOption options = 12;
}

message CreateWorkOrderRequest {
  string shop_id = 1;
  string vehicle_id = 2;
  // Odometer reading taken at intake, in km. Optional: 0 means nobody wrote it down, and the
  // service book shows a gap rather than inventing a number.
  int64 odometer = 3;
}
message SetWorkOrderOdometerRequest {
  string id = 1;
  int64 odometer = 2;
}
message GetWorkOrderRequest {
  string id = 1;
}
message AddLineItemRequest {
  string work_order_id = 1;
  LineItem line_item = 2;
  // Set by the gateway from the caller's role (owner/admin) to bypass the per-shop
  // discount cap. Not set by end clients.
  bool allow_discount_override = 3;
}
message UpdateLineItemRequest {
  string work_order_id = 1;
  string line_item_id = 2;
  string description = 3;
  int64 unit_price = 4; // agreed/negotiated sell price per unit (tiyin)
  double quantity = 5;  // billed quantity; may be fractional for materials
  int64 cost = 6;       // shop expense per unit (tiyin)
  // Exact stock amount this material line draws (may be fractional). Changing it re-adjusts the
  // linked variant's stock by the difference. Ignored for non-stock lines.
  double consumed_qty = 7;
  // Set by the gateway from the caller's role; lets owners/admins edit past the discount cap.
  bool allow_discount_override = 8;
}
message RemoveLineItemRequest {
  string work_order_id = 1;
  string line_item_id = 2;
}
// MaterialReturn is one line's worth of stock coming back off a job that is being called
// off. quantity is in the variant's own unit and may be fractional, because half a job is
// half a bottle: four of the five litres booked out can come back sealed while one is
// already in the engine.
message MaterialReturn {
  // The line the material was drawn on — a work order's line_item id, or a sale_item id.
  string line_id = 1;
  // How much goes back on the shelf. 0 leaves it written off; more than was drawn is
  // clamped to what was drawn, since a cancellation cannot create stock.
  double quantity = 2;
}

// MaterialSettlement is the shop's answer to "was this used or is it still on the shelf?",
// asked at the moment of cancelling because only the person standing there knows.
//
// Its absence and its emptiness mean different things, which is why it is a message and not
// a bare repeated field: absent means nobody was asked and each caller keeps the behaviour
// it had before this existed, while present-and-empty is a deliberate "none of it came
// back". Proto3 cannot tell those apart on a repeated field.
message MaterialSettlement {
  repeated MaterialReturn returns = 1;
}

message TransitionStateRequest {
  string work_order_id = 1;
  WorkOrderState target = 2;
  // Honoured only when target is CANCELED. Absent leaves the materials written off against
  // the abandoned job, which is what cancelling has always done.
  MaterialSettlement material_settlement = 3;
}
message AssignMechanicRequest {
  string work_order_id = 1;
  string mechanic_id = 2;
}
message AssignLineItemRequest {
  string work_order_id = 1;
  string line_item_id = 2;
  string mechanic_id = 3; // empty clears the assignment
}
message SetLineItemStatusRequest {
  string work_order_id = 1;
  string line_item_id = 2;
  LineItemStatus status = 3;
}
message SetWorkOrderNotesRequest {
  string work_order_id = 1;
  // The whole note, replacing whatever was there. Empty clears it.
  string notes = 2;
}
message SetOrderDiscountRequest {
  string work_order_id = 1;
  DiscountKind discount_kind = 2;
  // Fixed tiyin amount, or basis points for percent (100 = 1%). Ignored (treated as 0)
  // when discount_kind is UNSPECIFIED.
  int64 discount_value = 3;
}
message StartTimerRequest {
  string work_order_id = 1;
  string mechanic_id = 2;
}
message StopTimerRequest {
  string work_order_id = 1;
  string mechanic_id = 2;
}
message ListMenuItemsRequest {
  string shop_id = 1;
}
message ListMenuItemsResponse {
  repeated MenuItem items = 1;
}
message CreateMenuItemRequest {
  string shop_id = 1;
  string name_uz_latn = 2;
  string name_uz_cyrl = 3;
  string name_ru = 4;
  int64 default_price = 5;
  int64 default_cost = 6; // optional default shop expense per unit, in tiyin
  string category = 7;
  int32 estimated_minutes = 8;
  repeated MenuMaterial materials = 9; // materials this service is expected to need
  repeated MenuItemOption options = 10; // named ways to perform it, each priced
}

// UpdateMenuItem edits an existing price-list item. A price or cost change is recorded in
// the menu item's price history; existing work orders are unaffected (their line items keep
// the price snapshot taken when they were added).
message UpdateMenuItemRequest {
  string id = 1;
  string name_uz_latn = 2;
  string name_uz_cyrl = 3;
  string name_ru = 4;
  int64 default_price = 5;
  int64 default_cost = 6;
  string category = 7;
  int32 estimated_minutes = 8;
  bool active = 9;
  repeated MenuMaterial materials = 10;
  // Who is making the edit, set by the gateway from the token. Recorded on the price-history
  // row when the price or cost actually changes, so a price list says who moved a number
  // and not only that it moved.
  string staff_id = 11;
  // The full set of options after the edit. An option missing from the list is retired rather
  // than deleted, because line items already sold under it point at it.
  repeated MenuItemOption options = 12;
}

// MenuPriceChange is one entry in a menu item's price/cost change log.
message MenuPriceChange {
  string id = 1;
  string menu_item_id = 2;
  int64 old_price = 3;
  int64 new_price = 4;
  int64 old_cost = 5;
  int64 new_cost = 6;
  string changed_at = 7; // RFC3339
  // Who made the change. Empty for rows recorded before this was kept, and for any edit the
  // caller did not attribute — the screen then shows the change without an author rather
  // than naming the wrong person.
  string changed_by = 8;
}
message ListMenuPriceHistoryRequest {
  string menu_item_id = 1;
}
message ListMenuPriceHistoryResponse {
  repeated MenuPriceChange changes = 1;
}
